function toast(msg, type='info') {
  const colors = { info: 'bg-blue-600', success: 'bg-green-600', error: 'bg-red-600', warn: 'bg-yellow-600' };
  const div = document.createElement('div');
  div.className = `fixed top-4 left-4 right-4 ${colors[type]} text-white px-4 py-3 rounded-lg shadow-xl z-50 fade-in text-sm font-medium`;
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3500);
}

// Hitung jarak dua koordinat (Haversine, meter)
function jarakMeter(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function getLokasi() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject('GPS tidak tersedia');
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, akurasi: pos.coords.accuracy }),
      err => reject(err.message),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

function today() {

// ============================================
// KAMERA IN-APP
// ============================================
async function openCamera(section) {
  currentPhotoSection = section;
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
  } catch (e) {
    return toast('Tidak bisa akses kamera: ' + e.message, 'error');
  }

  const modal = document.createElement('div');
  modal.id = 'camModal';
  modal.className = 'fixed inset-0 bg-black z-50 flex flex-col';
  modal.innerHTML = `
    <div class="p-4 flex justify-between items-center text-white">
      <button onclick="closeCamera()" class="text-2xl">✕</button>
      <div class="text-sm">${SECTION_LABELS[section]}</div>
      <div class="w-6"></div>
    </div>
    <video id="camVideo" autoplay playsinline class="flex-1 w-full object-cover"></video>
    <canvas id="camCanvas" class="hidden"></canvas>
    <div class="p-6 flex justify-center">
      <button onclick="capturePhoto()" class="w-16 h-16 bg-white rounded-full border-4 border-slate-300 active:scale-95"></button>
    </div>
  `;
  document.body.appendChild(modal);
  $('camVideo').srcObject = cameraStream;
}

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  const m = $('camModal');
  if (m) m.remove();
}

function capturePhoto() {
  const video = $('camVideo');
  const canvas = $('camCanvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);

  // Watermark
  const timestamp = new Date().toLocaleString('id-ID');
  const wmText = `${currentCabang.nama} • ${timestamp}`;
  const fontSize = Math.max(16, canvas.width / 50);
  ctx.font = `bold ${fontSize}px sans-serif`;
  const textW = ctx.measureText(wmText).width;
  const padding = 12;

  // Background hitam transparan
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(canvas.width - textW - padding * 2 - 8, canvas.height - fontSize - padding * 2 - 8, textW + padding * 2, fontSize + padding * 2);

  // Text putih
  ctx.fillStyle = 'white';
  ctx.textBaseline = 'top';
  ctx.fillText(wmText, canvas.width - textW - padding - 8, canvas.height - fontSize - padding - 8);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
  capturedPhotos[currentPhotoSection].push(dataUrl);

  updatePhotoPreview(currentPhotoSection);
  closeCamera();
  cekKesiapanSubmit();
  toast('Foto tersimpan', 'success');
}

function updatePhotoPreview(section) {
  const preview = $(`preview-${section}`);
  const count = $(`count-${section}`);
  if (!preview) return;

  preview.innerHTML = capturedPhotos[section].map((url, i) => `
    <div class="relative">
      <img src="${url}" class="w-full h-20 object-cover rounded-lg"/>
      <button onclick="hapusFoto('${section}', ${i})" class="absolute top-1 right-1 bg-red-600 text-white w-6 h-6 rounded-full text-xs">✕</button>
    </div>
  `).join('');

  const c = capturedPhotos[section].length;
  const min = MIN_PHOTOS[section];
  count.textContent = `(${c}/${min})`;
  count.className = c >= min ? 'ml-1 text-xs text-green-600 font-bold' : 'ml-1 text-xs';
}

function hapusFoto(section, idx) {
  capturedPhotos[section].splice(idx, 1);
  updatePhotoPreview(section);
  cekKesiapanSubmit();
}

// ============================================
// CEK KESIAPAN SUBMIT
// ============================================
async function cekKesiapanSubmit() {
  const btn = $('btnSubmit');
  const status = $('submitStatus');
  if (!btn) return;

  // Cek foto minimum
  const semuaFotoOK = Object.keys(MIN_PHOTOS).every(k => capturedPhotos[k].length >= MIN_PHOTOS[k]);
  if (!semuaFotoOK) {
    btn.disabled = true;
    btn.className = 'w-full bg-slate-300 text-slate-500 font-bold py-3 rounded-lg cursor-not-allowed';
    btn.textContent = '📷 Lengkapi foto minimum';
    status.textContent = 'Foto belum lengkap sesuai minimum';
    return;
  }

  // Cek GPS
  status.textContent = '📍 Mengecek lokasi...';
  try {
    const lokasi = await getLokasi();
    const jarak = jarakMeter(lokasi.lat, lokasi.lng, currentCabang.latitude, currentCabang.longitude);
    window._lokasiSubmit = { ...lokasi, jarak };

    if (jarak > currentCabang.radius_meter) {
      btn.disabled = true;
      btn.className = 'w-full bg-red-500 text-white font-bold py-3 rounded-lg cursor-not-allowed';
      btn.textContent = '🔒 Di luar area toko';
      status.textContent = `Jarak dari toko: ${Math.round(jarak)}m (maks ${currentCabang.radius_meter}m)`;
      status.className = 'text-xs text-center mt-1 text-red-600 font-medium';
      return;
    }

    btn.disabled = false;
    btn.className = 'w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg';
    btn.textContent = '✅ Submit Jurnal';
    status.textContent = `📍 Di lokasi toko (${Math.round(jarak)}m dari titik pusat)`;
    status.className = 'text-xs text-center mt-1 text-green-600';
  } catch (e) {
    btn.disabled = true;
    btn.className = 'w-full bg-slate-300 text-slate-500 font-bold py-3 rounded-lg cursor-not-allowed';
    btn.textContent = '📍 GPS tidak aktif';
    status.textContent = 'Aktifkan GPS di HP dulu';
    status.className = 'text-xs text-center mt-1 text-red-600';
  }
}

// SUBMIT JURNAL
// ============================================
async function submitJurnal() {
  const btn = $('btnSubmit');
  btn.disabled = true;
  btn.textContent = '⏳ Menyimpan...';

  // Kumpulkan checklist
  const checklistData = { kebersihan: {}, stok: {}, karyawan: {}, pelayanan: {} };
  document.querySelectorAll('.checklist-item').forEach(el => {
    checklistData[el.dataset.section][el.dataset.idx] = el.checked;
  });

  // Cek deadline
  const now = new Date();
  const [dh, dm] = currentCabang.jam_deadline.split(':');
  const deadline = new Date(); deadline.setHours(+dh, +dm, 0, 0);
  const isLate = now > deadline;

  const lokasi = window._lokasiSubmit;

  // Insert jurnal
  const { data: jurnal, error } = await supabase.from('jurnal_harian').insert({
    cabang_id: currentCabang.id,
    manager_id: currentProfile.id,
    tanggal: today(),
    jam_datang: $('jam_datang').value,
    jumlah_karyawan: +$('jumlah_karyawan').value || 0,
    checklist_kebersihan: checklistData.kebersihan,
    checklist_stok: checklistData.stok,
    checklist_karyawan: checklistData.karyawan,
    checklist_pelayanan: checklistData.pelayanan,
    catatan: $('catatan').value,
    submit_lat: lokasi.lat,
    submit_lng: lokasi.lng,
    jarak_meter: lokasi.jarak,
    is_late: isLate
  }).select().single();

  if (error) {
    toast('Gagal simpan: ' + error.message, 'error');
    btn.disabled = false;
    btn.textContent = '✅ Submit Jurnal';
    return;
  }

  // Upload foto
  btn.textContent = '📤 Upload foto...';
  for (const section of Object.keys(capturedPhotos)) {
    for (let i = 0; i < capturedPhotos[section].length; i++) {
      const blob = await (await fetch(capturedPhotos[section][i])).blob();
      const path = `${today()}/${currentCabang.id}/${section}_${i}_${Date.now()}.jpg`;
      const { error: upErr } = await supabase.storage.from('foto-jurnal').upload(path, blob, { contentType: 'image/jpeg' });
      if (!upErr) {
        await supabase.from('foto_jurnal').insert({ jurnal_id: jurnal.id, section, storage_path: path });
      }
    }
  }

  toast('Jurnal berhasil disubmit! ✅', 'success');
  setTimeout(renderManagerHome, 1000);
}

async function loadDashboardData() {
  const tgl = $('tanggal_filter').value;
  const { data: cabangs } = await supabase.from('cabang').select('*').eq('aktif', true).order('nama');
  const { data: jurnals } = await supabase.from('jurnal_harian')
    .select('*, profiles(nama), foto_jurnal(id)')
    .eq('tanggal', tgl);

  const jurnalMap = {};
  (jurnals || []).forEach(j => { jurnalMap[j.cabang_id] = j; });

  const now = new Date();
  const list = $('dashboard_list');
  list.innerHTML = cabangs.map(cab => {
    const j = jurnalMap[cab.id];
    const [dh, dm] = cab.jam_deadline.split(':');
    const deadline = new Date(); deadline.setHours(+dh, +dm, 0, 0);
    const lewatDeadline = now > deadline;

    let status, bg, badge;
    if (!j) {
      if (lewatDeadline) { status = '❌ Belum Mengisi'; bg = 'bg-red-50 border-red-200'; badge = 'bg-red-600'; }
      else { status = '⏳ Belum Isi'; bg = 'bg-yellow-50 border-yellow-200'; badge = 'bg-yellow-500'; }
    } else if (j.is_late) {
      status = '⚠️ Terlambat'; bg = 'bg-orange-50 border-orange-200'; badge = 'bg-orange-500';
    } else {
      status = '✅ On Time'; bg = 'bg-green-50 border-green-200'; badge = 'bg-green-600';
    }

    // Hitung completion checklist
    let completion = '';
    if (j) {
      const total = Object.values(CHECKLIST).flat().length;
      let done = 0;
      ['kebersihan','stok','karyawan','pelayanan'].forEach(k => {
        const cl = j[`checklist_${k}`] || {};
        Object.values(cl).forEach(v => v === true && done++);
      });
      completion = `${done}/${total} (${Math.round(done/total*100)}%)`;
    }

    return `
      <div class="${bg} border rounded-xl p-4 cursor-pointer" onclick="${j ? `renderDetailJurnal('${j.id}')` : ''}">
        <div class="flex justify-between items-start">
          <div>
            <p class="font-bold">${cab.nama}</p>
            <p class="text-xs text-slate-500 mt-0.5">Deadline: ${cab.jam_deadline}</p>
          </div>
          <span class="${badge} text-white text-xs px-2 py-1 rounded-full font-medium">${status}</span>
        </div>
        ${j ? `
          <div class="mt-3 text-sm space-y-1">
            <p>👤 ${j.profiles?.nama || '-'}</p>
            <p>🕐 Submit: ${new Date(j.jam_submit).toLocaleTimeString('id-ID')}</p>
            <p>📊 Checklist: ${completion}</p>
            <p>📷 Foto: ${j.foto_jurnal.length}</p>
            <p>📍 Jarak dari toko: ${Math.round(j.jarak_meter || 0)}m</p>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

  }).join('') : '<p class="text-slate-500 text-sm">Tidak ada foto</p>';

  render(`
    <div class="min-h-screen pb-8">
      <div class="bg-white p-4 shadow-sm sticky top-0 z-10 flex items-center gap-3">
        <button onclick="renderOwnerDashboard()" class="text-slate-600">← </button>
        <div>
          <h2 class="font-bold">${j.cabang.nama}</h2>
          <p class="text-xs text-slate-500">${new Date(j.tanggal).toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long'})}</p>
        </div>

      <div class="p-4 space-y-4">
        <div class="bg-white rounded-xl p-4 shadow">
          <h3 class="font-bold mb-2">Info Submit</h3>
          <div class="text-sm space-y-1">
            <p>👤 Diisi oleh: <b>${j.profiles.nama}</b></p>
            <p>🕐 Jam datang: ${j.jam_datang || '-'}</p>
            <p>🕐 Jam submit: ${new Date(j.jam_submit).toLocaleTimeString('id-ID')} ${j.is_late ? '<span class="text-red-600 font-bold">(TERLAMBAT)</span>' : '<span class="text-green-600 font-bold">(ON TIME)</span>'}</p>
            <p>👥 Karyawan: ${j.jumlah_karyawan}</p>
            <p>📍 Jarak dari toko: ${Math.round(j.jarak_meter || 0)}m</p>
          </div>
        </div>

        ${checklistHtml}

        <div class="bg-white rounded-xl p-4 shadow">
          <h3 class="font-bold mb-2">📷 Foto Bukti (${fotos.length})</h3>
          <div class="grid grid-cols-2 gap-2">${fotoHtml}</div>
        </div>

        ${j.catatan ? `
          <div class="bg-white rounded-xl p-4 shadow">
            <h3 class="font-bold mb-2">📝 Catatan</h3>
            <p class="text-sm">${j.catatan}</p>

}

            </div>
          </div>
        `).join('')}

        <div class="bg-white rounded-xl p-4 shadow">
          <h3 class="font-bold mb-2">➕ Daftarkan Akun Manager Baru</h3>
          <p class="text-xs text-slate-500 mb-3">Owner masukkan email & password sementara, manager ganti sendiri nanti.</p>
          <div class="space-y-2">
            <input id="new_email" type="email" placeholder="Email (contoh: talun@aww.local)" class="w-full px-3 py-2 border rounded-lg text-sm"/>

            <input id="new_nama" type="text" placeholder="Nama manager" class="w-full px-3 py-2 border rounded-lg text-sm"/>

            </select>
            <button onclick="tambahManager()" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-bold">Daftarkan</button>

async function ambilLokasi(cabangId) {
  toast('Mengambil GPS...', 'info');
  try {
    const lok = await getLokasi();
    $(`lat_${cabangId}`).value = lok.lat;
    $(`lng_${cabangId}`).value = lok.lng;
    toast(`Lokasi diambil (akurasi ${Math.round(lok.akurasi)}m)`, 'success');
  } catch (e) {
    toast('Gagal ambil lokasi: ' + e, 'error');
  }
}

async function simpanCabang(cabangId) {
  const { error } = await supabase.from('cabang').update({
    latitude: +$(`lat_${cabangId}`).value,
    longitude: +$(`lng_${cabangId}`).value,
    radius_meter: +$(`rad_${cabangId}`).value,
    jam_deadline: $(`dl_${cabangId}`).value
  }).eq('id', cabangId);

  if (error) return toast('Gagal simpan: ' + error.message, 'error');
  toast('Tersimpan ✅', 'success');
}

async function tambahManager() {
  const email = $('new_email').value.trim();
  const password = $('new_password').value.trim();
  const nama = $('new_nama').value.trim();
  const cabangId = $('new_cabang').value;

  if (!email || !password || !nama || !cabangId) return toast('Semua field wajib diisi', 'error');
  if (password.length < 6) return toast('Password minimal 6 karakter', 'error');

  const { data, error } = await supabase.auth.signUp({ email, password });
  if (error) return toast('Gagal daftar: ' + error.message, 'error');

  const { error: pErr } = await supabase.from('profiles').insert({
    id: data.user.id, nama, role: 'manager', cabang_id: cabangId
  });

  if (pErr) return toast('Profile error: ' + pErr.message, 'error');
  toast('Manager berhasil didaftarkan ✅', 'success');
  $('new_email').value = ''; $('new_password').value = ''; $('new_nama').value = '';
}

// INIT
// ============================================
(async () => {
  try {
    const { data } = await supabase.auth.getSession();
    if (data && data.session) {
      currentUser = data.session.user;
      await loadProfile();
      if (currentProfile) return routeByRole();
    }
  } catch (e) {
    console.error('Init error:', e);
  }
  renderLogin();
})();
</script>
